services:
  - type: web
    name: 24-7support-backend
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci && npm ci --prefix client && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: APP_URL
        fromService:
          type: web
          name: 24-7support-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_PATH
        value: /var/data/support.sqlite
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: INTEGRATION_ENCRYPTION_KEY
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: WHOP_ENVIRONMENT
        value: sandbox
    disk:
      name: support-data
      mountPath: /var/data
      sizeGB: 1
